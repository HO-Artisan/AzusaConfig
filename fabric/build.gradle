plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    shadowBundle("org.quiltmc:quilt-config:${rootProject.quiltconfig_version}")
    shadowBundle("org.quiltmc.parsers:json:${rootProject.quiltparsers_version}")
    shadowBundle("org.quiltmc.quilt-config.serializers:toml:${rootProject.quiltconfig_version}")
    shadowBundle("org.quiltmc.quilt-config.serializers:json5:${rootProject.quiltconfig_version}")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    relocate "com.electronwill.nightconfig", "${rootProject.maven_group}.shadow.nightconfig"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publisher {
    apiKeys {
        modrinth System.getenv("MODRINTH_TOKEN")
        curseforge System.getenv("CURSE_TOKEN")
    }

    setCurseID("${project.curseforge_id}")
    setModrinthID("${project.modrinth_id}")
    setVersionType("alpha")
    setChangelog(file("CHANGELOG.md").getText("UTF-8"))
    setVersion("${project.version}-fabric")
    setDisplayName("[Fabric] ${project.version}")
    setGameVersions("1.20.2", "1.20.3", "1.20.4")
    setLoaders("fabric")
    setArtifact(remapJar)
    addAdditionalFile(sourcesJar)
}